<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1B1B"/>
      <stop offset="0.55" stop-color="#161616"/>
      <stop offset="1" stop-color="#0E0E0E"/>
    </linearGradient>
    <linearGradient id="pole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#C9A227" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <!-- Subtle barber-pole diagonal stripes -->
  <g opacity="0.05">
    <g>
      <path d="M0 0 L160 0 L40 800 L-120 800 Z" fill="#C9A227"/>
      <path d="M200 0 L360 0 L240 800 L80 800 Z" fill="#C9A227"/>
      <path d="M400 0 L560 0 L440 800 L280 800 Z" fill="#C9A227"/>
      <path d="M600 0 L760 0 L640 800 L480 800 Z" fill="#C9A227"/>
      <path d="M800 0 L960 0 L840 800 L680 800 Z" fill="#C9A227"/>
      <path d="M1000 0 L1160 0 L1040 800 L880 800 Z" fill="#C9A227"/>
      <path d="M1200 0 L1280 0 L1200 320 L1120 800 Z" fill="#C9A227"/>
    </g>
  </g>

  <!-- Barber pole -->
  <g transform="translate(600 400)" opacity="0.85">
    <rect x="-9" y="-170" width="18" height="340" rx="9" fill="url(#pole)"/>
    <g stroke="#161616" stroke-width="9">
      <path d="M-9 -170 L9 -146 L-9 -122 L9 -98 L-9 -74 L9 -50 L-9 -26 L9 -2 L-9 22 L9 46 L-9 70 L9 94 L-9 118 L9 142 L-9 166"/>
    </g>
    <rect x="-16" y="-178" width="32" height="14" rx="7" fill="#C9A227"/>
    <rect x="-16" y="164" width="32" height="14" rx="7" fill="#C9A227"/>
  </g>

  <!-- Vignette -->
  <rect width="1200" height="800" fill="url(#bg)" opacity="0.12"/>
</svg>
